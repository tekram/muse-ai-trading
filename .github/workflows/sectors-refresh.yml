name: Sector strength refresh

# Regenerates data/sectors.json (Sector Strength tab) every 15 minutes
# during market hours. Cron is UTC; 13-21 UTC covers 8:00 AM-4:00 PM CT
# in summer (CDT) and 7:00 AM-3:00 PM CT in winter (CST).
on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sectors-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python scripts/update_sectors.py
      - name: Commit if changed
        run: |
          git config user.name "muse-sectors-bot"
          git config user.email "muse-sectors-bot@users.noreply.github.com"
          git add data/sectors.json
          git diff --cached --quiet || git commit -m "Sector strength snapshot (auto-refresh)"
          git push
